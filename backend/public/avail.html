<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c59c6c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChurchFlow">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ChurchFlow — Volunteer Attendance Confirmation</title>
  <link rel="icon" type="image/png" href="/churchflow-logo.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-inner: #fbf8f3;
      --border: #eadbc4;
      --border-strong: #dcc29e;
      --primary: #c59c6c;
      --primary-hover: #b38856;
      --primary-light: #fbf8f3;
      --primary-border: #eadbc4;
      --success: #16a34a;
      --success-hover: #15803d;
      --success-light: #f0fdf4;
      --success-border: #bbf7d0;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --danger-light: #fef2f2;
      --danger-border: #fecaca;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --amber-border: #fde68a;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow: 0 4px 20px -2px rgba(197, 156, 108, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      --modal-overlay: rgba(15, 23, 42, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 60px 14px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .brand-text {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .brand-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      padding: 3px 8px;
      border-radius: 9999px;
      margin-left: 6px;
    }

    /* Service Banner Card */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #9e7343, #c59c6c, #d0af83);
    }

    .church-name {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .service-date {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Device Lock Status Banner */
    .lock-status-banner {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .lock-status-banner strong {
      color: var(--primary);
    }

    .btn-switch-link {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: underline;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
    }

    .btn-switch-link:hover {
      color: var(--danger);
    }

    /* Section Header */
    .section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }

    /* Lineup Cards */
    .lineup-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .position-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s;
    }

    .position-card.is-claimed-by-me {
      border: 2px solid var(--primary);
      background: #fffdfa;
      box-shadow: 0 6px 24px -2px rgba(197, 156, 108, 0.25);
    }

    .position-card.is-other-locked {
      opacity: 0.75;
      background: #fafaf9;
    }

    .position-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .position-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .position-icon-bubble {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .position-titles {
      min-width: 0;
    }

    .position-role-name {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
    }

    .musician-assigned-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 9999px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-badge.confirmed {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .status-badge.declined {
      background: var(--danger-light);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    .status-badge.pending {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .status-badge.vacant {
      background: #f1f5f9;
      color: #94a3b8;
      border: 1px solid #e2e8f0;
    }

    /* Action Buttons in Card */
    .card-actions-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .btn-claim-me {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(197, 156, 108, 0.3);
    }

    .btn-claim-me:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-manage-me {
      background: var(--card-bg);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-manage-me:hover {
      background: var(--primary-light);
    }

    .locked-card-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Modal Backdrop & Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      text-align: center;
      transform: translateY(16px);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0);
    }

    .modal-icon-bubble {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px auto;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .notice-box {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: left;
    }

    .alert-box-danger {
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      border-radius: 14px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 20px;
      font-weight: 600;
    }

    /* PIN Input Field */
    .pin-input-container {
      margin-bottom: 18px;
    }

    .pin-input {
      width: 180px;
      height: 52px;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 12px;
      border: 2px solid var(--border-strong);
      border-radius: 16px;
      background: var(--card-inner);
      color: var(--text);
      outline: none;
      transition: all 0.15s;
    }

    .pin-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(197, 156, 108, 0.2);
    }

    .pin-error-text {
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* Modal Buttons */
    .modal-buttons-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-modal-cancel {
      background: #f1f5f9;
      color: var(--text-secondary);
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-modal-cancel:hover {
      background: #e2e8f0;
    }

    .btn-modal-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 12px rgba(197, 156, 108, 0.3);
    }

    .btn-modal-primary:hover {
      background: var(--primary-hover);
    }

    /* Large Decision Buttons (Step 4) */
    .decision-buttons-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-decision-accept {
      background: var(--success);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.3);
      transition: all 0.15s;
    }

    .btn-decision-accept:hover {
      background: var(--success-hover);
      transform: translateY(-1px);
    }

    .btn-decision-decline {
      background: var(--danger);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
      transition: all 0.15s;
    }

    .btn-decision-decline:hover {
      background: var(--danger-hover);
      transform: translateY(-1px);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 14px 22px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { background: #15803d; border: 1px solid #22c55e; }
    .toast.error { background: #b91c1c; border: 1px solid #ef4444; }
    .toast.info { background: #1e3a8a; border: 1px solid #3b82f6; }

    .loading-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
    }

    .error-card {
      background: var(--danger-light);
      border: 1px solid var(--danger-border);
      color: var(--danger);
      padding: 24px;
      border-radius: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="container" id="app">
    <div class="loading-box">
      <div style="font-size: 28px; margin-bottom: 10px;">⏳</div>
      Loading Sunday lineup...
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-card" id="modalCard">
      <!-- Dynamic modal content injected by JS -->
    </div>
  </div>

  <script>
    const token = window.location.pathname.split('/').pop();
    let serviceData = null;
    let assignmentsList = [];
    let churchData = null;
    let activeClaimed = null; // { musician_id, musician_name, claim_token, status }

    // Load device claim from localStorage
    function getStoredClaim() {
      try {
        const raw = localStorage.getItem('cf_claimed_' + token);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveClaim(claimData) {
      localStorage.setItem('cf_claimed_' + token, JSON.stringify(claimData));
      activeClaimed = claimData;
    }

    function clearClaim() {
      localStorage.removeItem('cf_claimed_' + token);
      activeClaimed = null;
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => {
        toast.className = 'toast';
      }, 4500);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const clean = typeof dateStr === 'string' ? dateStr.split('T')[0] : '';
      const d = new Date(clean + 'T00:00:00');
      if (isNaN(d.getTime())) {
        const fallback = new Date(dateStr);
        return isNaN(fallback.getTime()) ? dateStr : fallback.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }
      return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    const iconMap = {
      'Worship Leader': '🎤',
      'Guitar': '🎸',
      'Second Guitar': '🎸',
      'Bass': '🎸',
      'Lead Keyboard': '🎹',
      'Second Keyboard': '🎹',
      'Keyboard': '🎹',
      'Drums': '🥁',
      'Backup Singer': '🎙️',
      'Vocals': '🎙️',
      'Sound (FOH)': '🎚️',
      'Sound': '🎚️',
      'Media': '🎥',
      'Visuals': '🖥️',
      'Camera': '📹',
      'Usher': '🤝'
    };

    function getPositionIcon(name) {
      for (const [key, icon] of Object.entries(iconMap)) {
        if (name.toLowerCase().includes(key.toLowerCase())) return icon;
      }
      return '🎵';
    }

    async function loadData() {
      try {
        const res = await fetch(`/api/public/avail/${token}`);
        if (!res.ok) {
          throw new Error(res.status === 404 ? 'Service link is invalid or expired.' : 'Failed to load details.');
        }
        const data = await res.json();
        serviceData = data.service;
        assignmentsList = data.assignments || [];
        churchData = data.church;
        activeClaimed = getStoredClaim();
        render();
      } catch (err) {
        document.getElementById('app').innerHTML = `
          <div class="error-card">
            <h2 style="font-size: 20px; margin-bottom: 8px;">⚠️ Link Not Found</h2>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    // Modal state controllers
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCard = document.getElementById('modalCard');

    function closeModal() {
      modalOverlay.classList.remove('open');
    }

    // Step 2: "Is This You?" Confirmation Modal
    function openConfirmModal(musicianId, musicianName, positionName, hasPhone) {
      modalCard.innerHTML = `
        <div class="modal-icon-bubble">👤</div>
        <h2 class="modal-title">Confirm Your Identity</h2>
        <p class="modal-subtitle">
          You selected: <strong>${musicianName}</strong><br>
          Assigned to: <strong>${positionName}</strong>
        </p>
        <div class="notice-box">
          ⚠️ <strong>Device Lock Notice:</strong><br>
          Clicking "Yes, this is me" will link this phone to <strong>${musicianName}</strong> for this Sunday's service. Other team positions will be locked on this device.
        </div>
        <div class="modal-buttons-row">
          <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-modal-primary" onclick="proceedToPinStep('${musicianId}', '${escapeHtml(musicianName)}', '${escapeHtml(positionName)}', ${hasPhone})">Yes, this is me</button>
        </div>
      `;
      modalOverlay.classList.add('open');
    }

    // Step 3: PIN Input or Unregistered Alert
    function proceedToPinStep(musicianId, musicianName, positionName, hasPhone) {
      if (!hasPhone) {
        modalCard.innerHTML = `
          <div class="modal-icon-bubble" style="background:var(--danger-light); border-color:var(--danger-border); color:var(--danger);">⚠️</div>
          <h2 class="modal-title" style="color:var(--danger);">Phone Not Registered</h2>
          <div class="alert-box-danger">
            You are not registered with a mobile number in our system. Please contact your church administrator or leader to register your phone.
          </div>
          <div class="modal-buttons-row">
            <button class="btn-modal-cancel" style="grid-column: span 2;" onclick="closeModal()">Close</button>
          </div>
        `;
        return;
      }

      modalCard.innerHTML = `
        <div class="modal-icon-bubble">🔒</div>
        <h2 class="modal-title">Enter 4-Digit PIN</h2>
        <p class="modal-subtitle">
          Please enter the <strong>last 4 digits of your mobile number</strong> to verify your identity as <strong>${musicianName}</strong>:
        </p>
        <div class="pin-input-container">
          <input type="password" id="pinInput" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autofocus />
          <div id="pinError" class="pin-error-text" style="display:none;"></div>
        </div>
        <div class="modal-buttons-row">
          <button class="btn-modal-cancel" onclick="closeModal()">Back</button>
          <button class="btn-modal-primary" id="btnVerify" onclick="submitPinVerification('${musicianId}', '${escapeHtml(musicianName)}', '${escapeHtml(positionName)}')">Verify PIN</button>
        </div>
      `;

      setTimeout(() => {
        const inp = document.getElementById('pinInput');
        if (inp) {
          inp.focus();
          inp.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') submitPinVerification(musicianId, musicianName, positionName);
          });
        }
      }, 100);
    }

    async function submitPinVerification(musicianId, musicianName, positionName) {
      const pinInput = document.getElementById('pinInput');
      const pinError = document.getElementById('pinError');
      const btnVerify = document.getElementById('btnVerify');
      const pin = pinInput.value.trim();

      if (pin.length < 4) {
        pinError.textContent = 'Please enter all 4 digits.';
        pinError.style.display = 'block';
        return;
      }

      btnVerify.disabled = true;
      btnVerify.textContent = 'Verifying...';
      pinError.style.display = 'none';

      try {
        const res = await fetch(`/api/public/avail/${token}/verify-pin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ musician_id: musicianId, pin: pin })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'PIN verification failed.');
        }

        // Store claim on device
        saveClaim({
          musician_id: musicianId,
          musician_name: musicianName,
          position_name: positionName,
          claim_token: data.claim_token,
        });

        // Advance to Step 4: Decision Screen
        openDecisionModal(musicianId, musicianName, positionName);
      } catch (err) {
        pinError.textContent = err.message;
        pinError.style.display = 'block';
        btnVerify.disabled = false;
        btnVerify.textContent = 'Verify PIN';
      }
    }

    // Step 4: Decision Screen (Accept or Decline)
    function openDecisionModal(musicianId, musicianName, positionName) {
      modalCard.innerHTML = `
        <div class="modal-icon-bubble">⛪</div>
        <h2 class="modal-title">Sunday Service Attendance</h2>
        <p class="modal-subtitle" style="font-size: 14px;">
          Hi <strong>${musicianName}</strong>, will you be serving on <strong>${positionName}</strong> this Sunday?
        </p>
        <div class="notice-box" style="text-align: center;">
          📅 <strong>${formatDate(serviceData.service_date)}</strong> • ⏰ ${serviceData.service_time || '10:00 AM'}<br>
          📍 ${serviceData.campus_name || 'Main Sanctuary'}
        </div>
        <div class="decision-buttons-stack">
          <button class="btn-decision-accept" onclick="executeDecision('${musicianId}', '${escapeHtml(musicianName)}', 'available')">
            ✅ YES, I'm Serving
          </button>
          <button class="btn-decision-decline" onclick="confirmDecline('${musicianId}', '${escapeHtml(musicianName)}')">
            ❌ NO, Can't Make It
          </button>
        </div>
        <div style="margin-top: 14px;">
          <button class="btn-modal-cancel" style="width: 100%;" onclick="closeModal()">Decide Later</button>
        </div>
      `;
      modalOverlay.classList.add('open');
    }

    function confirmDecline(musicianId, musicianName) {
      modalCard.innerHTML = `
        <div class="modal-icon-bubble" style="background:var(--danger-light); border-color:var(--danger-border); color:var(--danger);">⚠️</div>
        <h2 class="modal-title" style="color:var(--danger);">Confirm Decline</h2>
        <p class="modal-subtitle">
          Are you sure you cannot serve this Sunday, <strong>${musicianName}</strong>?
        </p>
        <div class="alert-box-danger">
          Notice: Once you decline, ChurchFlow's auto-roster engine will immediately promote a standby backup volunteer to fill your position.
        </div>
        <div class="modal-buttons-row">
          <button class="btn-modal-cancel" onclick="openDecisionModal('${musicianId}', '${escapeHtml(musicianName)}')">Go Back</button>
          <button class="btn-modal-primary" style="background:var(--danger);" onclick="executeDecision('${musicianId}', '${escapeHtml(musicianName)}', 'declined')">Yes, Decline</button>
        </div>
      `;
    }

    async function executeDecision(musicianId, musicianName, status) {
      const claim = activeClaimed || getStoredClaim();
      const claimToken = claim?.claim_token || null;

      try {
        const res = await fetch(`/api/public/avail/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            musician_id: musicianId,
            status: status,
            claim_token: claimToken,
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to submit response.');

        // Update stored claim status
        if (activeClaimed) {
          activeClaimed.status = status;
          saveClaim(activeClaimed);
        }

        // Show Success in modal
        modalCard.innerHTML = `
          <div class="modal-icon-bubble" style="background: ${status === 'available' ? 'var(--success-light)' : 'var(--danger-light)'}; border-color: ${status === 'available' ? 'var(--success-border)' : 'var(--danger-border)'}; font-size: 32px;">
            ${status === 'available' ? '✅' : '👋'}
          </div>
          <h2 class="modal-title">${status === 'available' ? 'Attendance Confirmed!' : 'Response Recorded'}</h2>
          <p class="modal-subtitle">
            ${status === 'available' 
              ? `Thank you, <strong>${musicianName}</strong>! You are confirmed to serve this Sunday.`
              : `Thank you for letting us know, <strong>${musicianName}</strong>. Our team has been notified.`}
          </p>
          <div style="margin-top: 18px;">
            <button class="btn-modal-primary" style="width: 100%;" onclick="closeModalAndRefresh()">View Full Lineup</button>
          </div>
        `;

        if (data.reShuffle && data.reShuffle.notifications && data.reShuffle.notifications.length > 0) {
          showToast(`🔄 ${data.reShuffle.notifications[0]}`, 'info');
        }
      } catch (err) {
        showToast(err.message, 'error');
        closeModal();
      }
    }

    async function closeModalAndRefresh() {
      closeModal();
      await loadData();
    }

    function switchMusicianIdentity() {
      if (confirm('Do you want to switch to a different name on this device?')) {
        clearClaim();
        showToast('Device lock cleared. You may now select your name.', 'info');
        render();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function render() {
      const app = document.getElementById('app');

      // Group assignments uniquely by position
      const grouped = {};
      for (const a of assignmentsList) {
        const name = a.position_name || 'Position';
        if (!grouped[name]) {
          grouped[name] = {
            position_name: name,
            musician_id: a.musician_id || null,
            musician: a.musician_name || null,
            has_phone: a.has_phone !== undefined ? a.has_phone : true,
            status: a.status || (a.musician_name ? 'pending' : 'vacant')
          };
        } else if (a.musician_name && !grouped[name].musician) {
          grouped[name].musician_id = a.musician_id;
          grouped[name].musician = a.musician_name;
          grouped[name].has_phone = a.has_phone !== undefined ? a.has_phone : true;
          grouped[name].status = a.status || 'pending';
        }
      }

      const rows = Object.values(grouped).filter(r => !r.position_name.toLowerCase().includes('worship leader'));
      const hasClaimed = Boolean(activeClaimed && activeClaimed.musician_id);

      let html = `
        <!-- Top Bar with Brand -->
        <div class="top-bar">
          <div class="logo-badge">
            <img src="/churchflow-logo.png" alt="ChurchFlow" class="logo-img" onerror="this.src='/churchflow.png'" />
            <span class="brand-text">ChurchFlow</span>
            <span class="brand-tag">RSVP</span>
          </div>
        </div>

        <!-- Service Header Card -->
        <div class="header-card">
          <div class="church-name">${churchData?.church_name || 'JESUS MY ROCK CHURCH'}</div>
          <div class="service-date">${formatDate(serviceData.service_date)}</div>
          
          <div class="meta-pills">
            <span class="meta-pill">⏰ ${serviceData.service_time || '10:00 AM'}</span>
            ${serviceData.campus_name ? `<span class="meta-pill">📍 ${serviceData.campus_name}</span>` : ''}
            ${serviceData.theme ? `<span class="meta-pill">📖 ${serviceData.theme}</span>` : ''}
          </div>
        </div>

        <!-- Device Identity Status Banner -->
        ${hasClaimed ? `
          <div class="lock-status-banner">
            <div>
              <span>📱 Connected as: <strong>${activeClaimed.musician_name}</strong></span>
            </div>
            <button class="btn-switch-link" onclick="switchMusicianIdentity()">Not you? Switch</button>
          </div>
        ` : ''}

        <!-- Lineup Section Header -->
        <div class="section-title">
          <span>👥 Sunday Serving Team</span>
        </div>

        <!-- Position Cards List -->
        <div class="lineup-container">
          ${rows.map(r => {
            const icon = getPositionIcon(r.position_name);
            const isAssigned = Boolean(r.musician && r.musician_id);
            const isMyCard = hasClaimed && activeClaimed.musician_id === r.musician_id;
            const pStatus = isAssigned ? (r.status || 'pending') : 'vacant';
            const isConfirmed = pStatus === 'confirmed';
            const isDeclined = pStatus === 'declined';

            return `
              <div class="position-card ${isMyCard ? 'is-claimed-by-me' : (hasClaimed ? 'is-other-locked' : '')}">
                <div class="position-card-header">
                  <div class="position-info">
                    <div class="position-icon-bubble">
                      ${icon}
                    </div>
                    <div class="position-titles">
                      <div class="position-role-name">${r.position_name}</div>
                      <div class="musician-assigned-name">
                        ${isAssigned ? r.musician : '<span style="color:var(--text-muted); font-weight:500; font-style:italic;">Vacant / Unassigned</span>'}
                        ${isMyCard ? '<span style="font-size:10px; background:var(--primary); color:#fff; padding:2px 7px; border-radius:999px; font-weight:900;">YOU</span>' : ''}
                      </div>
                    </div>
                  </div>

                  <span class="status-badge ${pStatus}">
                    ${isConfirmed ? '✓ Confirmed' : isDeclined ? '✕ Declined' : (isAssigned ? '⏳ Pending' : 'Vacant')}
                  </span>
                </div>

                ${isAssigned ? `
                  <div class="card-actions-row">
                    ${!hasClaimed ? `
                      <button 
                        class="btn-claim-me" 
                        onclick="openConfirmModal('${r.musician_id}', '${escapeHtml(r.musician)}', '${escapeHtml(r.position_name)}', ${r.has_phone})"
                      >
                        👤 This is Me
                      </button>
                    ` : (isMyCard ? `
                      <button 
                        class="btn-manage-me" 
                        onclick="openDecisionModal('${r.musician_id}', '${escapeHtml(r.musician)}', '${escapeHtml(r.position_name)}')"
                      >
                        📝 Update Attendance
                      </button>
                    ` : `
                      <span class="locked-card-label">
                        🔒 Locked to ${r.musician.split(' ')[0]}
                      </span>
                    `)}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;

      app.innerHTML = html;
    }

    loadData();
  </script>
  <footer style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted);">
    <strong style="color: var(--primary);">Jesus My Rock Church</strong> • ChurchFlow
  </footer>
</body>
</html>
